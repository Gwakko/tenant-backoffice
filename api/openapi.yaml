components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT (Ed25519). Required on every operation except login, health and refresh.
    refreshCookie:
      type: apiKey
      in: cookie
      name: tb_refresh
      description: HttpOnly refresh cookie, used by POST /auth/refresh only.
    csrfHeader:
      type: apiKey
      in: header
      name: X-TB-CSRF
      description: Must be `1` on requests authenticated by the refresh cookie.
  headers:
    XRequestId:
      description: Request id (echo of a valid incoming X-Request-Id, otherwise generated).
      schema: { type: string, pattern: '^[A-Za-z0-9-]{8,64}$' }
    RetryAfter:
      description: Seconds until the next attempt is allowed.
      schema: { type: integer, minimum: 0 }
    SetCookie:
      description: The tb_refresh cookie (HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth); cleared on logout.
      schema: { type: string }
    IdempotentReplayed:
      description: Present with the value `true` when the response is a replay of an earlier request with the same key.
      schema: { type: string, enum: ['true'] }
  parameters:
    NodeId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OperationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SettingKeyPath:
      name: key
      in: path
      required: true
      description: One of the `SettingKey` values; an unknown key is answered with 404 `unknown_setting`, so it is not an enum here.
      schema: { type: string, minLength: 1, maxLength: 64 }
    NodeIdQuery:
      name: nodeId
      in: query
      required: true
      schema: { type: string, format: uuid }
    ScopeNodeId:
      name: scopeNodeId
      in: query
      required: true
      schema: { type: string, format: uuid }
    NodeIdFilter:
      name: nodeId
      in: query
      required: false
      description: Must be inside the subtree of the scope node, otherwise 404.
      schema: { type: string, format: uuid }
    ActorIdFilter:
      name: actorId
      in: query
      required: false
      schema: { type: string, format: uuid }
    ActionFilter:
      name: action
      in: query
      required: false
      schema: { $ref: '#/components/schemas/AuditAction' }
    KindFilter:
      name: kind
      in: query
      required: false
      description: Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: '#/components/schemas/OperationKind' }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1..200 (outside the range is 400 `validation_failed`).
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `nextCursor`.
      schema: { type: string }
    StatusFilter:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [active, inactive, all], default: all }
    Query:
      name: q
      in: query
      required: false
      description: Substring of the name (`%` and `_` are literal).
      schema: { type: string, maxLength: 100 }
    Inherited:
      name: inherited
      in: query
      required: false
      schema: { type: boolean, default: false }
    IncludeInactive:
      name: includeInactive
      in: query
      required: false
      schema: { type: boolean, default: true }
    From:
      name: from
      in: query
      required: false
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: false
      schema: { type: string, format: date-time }
    ReportFrom:
      name: from
      in: query
      required: true
      description: Start date, inclusive (`YYYY-MM-DD`, local to `tz`). A value that is not a real date is 400 `invalid_period`.
      schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
    ReportTo:
      name: to
      in: query
      required: true
      description: End date, exclusive; the period is at most 366 days. A value that is not a real date is 400 `invalid_period`.
      schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
    Tz:
      name: tz
      in: query
      required: false
      description: IANA zone name; empty means the effective `display_timezone` of the node.
      schema: { type: string, maxLength: 64 }
    Granularity:
      name: granularity
      in: query
      required: false
      schema: { type: string, enum: [day, week, month], default: day }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_\-:.]+$' }
  responses:
    BadRequest:
      description: Invalid request
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication failed
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The object is visible but the right is missing
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such object or it is outside the subtree of the actor
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Body is larger than 64 KiB
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Content-Type is not application/json
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Well-formed request that breaks a domain rule
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Unexpected error
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: The database is unavailable
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    MoneyAmount:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: Non-negative integer amount in minor units, as a string (at most MaxInt64).
    ReportSum:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)$'
      description: Signed integer sum in minor units, as a string.
    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
    Password:
      type: string
      minLength: 12
      maxLength: 128
      description: 12..128 bytes (UTF-8).
    NodeType:
      type: string
      enum: [platform, partner, company, unit]
    NodeStatus:
      type: string
      enum: [active, inactive]
    NodeName:
      type: string
      minLength: 1
      maxLength: 100
      description: 1..100 characters after trimming.
    Role:
      type: string
      enum: [viewer, analyst, admin, owner]
    Permission:
      type: string
      enum:
        - node.read
        - settings.read
        - balance.read
        - operation.read
        - report.read
        - audit.read
        - member.read
        - node.create
        - node.rename
        - node.move
        - node.deactivate
        - settings.write
        - balance.credit
        - balance.debit
        - balance.transfer
        - member.manage
        - node.delete
    OperationKind:
      type: string
      enum: [credit, debit, transfer_out, transfer_in]
    SettingKey:
      type: string
      enum: [display_timezone, operations_enabled, max_operation_amount]
    AuditAction:
      type: string
      enum:
        - node.created
        - node.renamed
        - node.moved
        - node.child_moved_out
        - node.child_moved_in
        - node.deactivated
        - node.activated
        - node.deleted
        - member.granted
        - member.changed
        - member.revoked
        - user.created
        - settings.set
        - settings.unset
        - balance.credited
        - balance.debited
        - balance.transferred
        - auth.password_changed
    AuditTargetType:
      type: string
      enum: [node, member, user, setting, balance]
    ErrorCode:
      type: string
      enum:
        - validation_failed
        - invalid_id
        - invalid_amount
        - amount_must_be_positive
        - invalid_cursor
        - invalid_period
        - same_node
        - idempotency_key_required
        - idempotency_key_invalid
        - invalid_credentials
        - token_missing
        - token_expired
        - token_invalid
        - refresh_invalid
        - forbidden
        - not_found
        - name_taken
        - node_inactive
        - operations_disabled
        - insufficient_funds
        - balance_overflow
        - node_has_children
        - node_has_balance
        - node_has_history
        - children_limit
        - last_root_owner
        - user_inactive
        - invalid_parent_type
        - move_cycle
        - root_immutable
        - role_not_grantable
        - unknown_setting
        - invalid_setting_value
        - amount_exceeds_limit
        - idempotency_key_reused
        - payload_too_large
        - unsupported_media_type
        - rate_limited
        - db_unavailable
        - internal
        - invalid_password
        - invalid_node_type
        - invalid_name
        - invalid_email
        - invalid_role
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
    Problem:
      type: object
      description: RFC 9457 problem details. `errors` is present only on 400/422 with field errors.
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        code: { $ref: '#/components/schemas/ErrorCode' }
        detail: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        requestId: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { type: string, minLength: 1, maxLength: 128 }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { $ref: '#/components/schemas/Password' }
    UserRef:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { $ref: '#/components/schemas/Email' }
    TokenResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, minimum: 1, description: Lifetime in seconds. }
        user: { $ref: '#/components/schemas/UserRef' }
    AccessRoot:
      type: object
      required: [nodeId, name, type, role]
      properties:
        nodeId: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/NodeType' }
        role: { $ref: '#/components/schemas/Role' }
    Me:
      type: object
      required: [id, email, accessRoots]
      properties:
        id: { type: string, format: uuid }
        email: { $ref: '#/components/schemas/Email' }
        accessRoots:
          type: array
          items: { $ref: '#/components/schemas/AccessRoot' }
    NodePermissions:
      type: object
      required: [nodeId, role, permissions]
      properties:
        nodeId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    Breadcrumb:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/NodeType' }
    Node:
      type: object
      required: [id, type, parentId, name, status, effectiveActive, childrenCount, breadcrumbs, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NodeType' }
        parentId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        status: { $ref: '#/components/schemas/NodeStatus' }
        effectiveActive: { type: boolean }
        childrenCount: { type: integer, minimum: 0, maximum: 1000 }
        breadcrumbs:
          type: array
          description: Starts at the access root of the actor; ancestors outside the subtree are not revealed.
          items: { $ref: '#/components/schemas/Breadcrumb' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NodeSummary:
      type: object
      required: [id, type, name, status, childrenCount]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NodeType' }
        name: { type: string }
        status: { $ref: '#/components/schemas/NodeStatus' }
        childrenCount: { type: integer, minimum: 0, maximum: 1000 }
    NodeSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NodeSummary' }
        nextCursor: { type: string, nullable: true }
    CreateNodeRequest:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type: { $ref: '#/components/schemas/NodeType' }
        name: { $ref: '#/components/schemas/NodeName' }
    RenameNodeRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/NodeName' }
    MoveNodeRequest:
      type: object
      additionalProperties: false
      required: [newParentId]
      properties:
        newParentId: { type: string, format: uuid }
    SettingValue:
      description: |
        Type depends on the key: `display_timezone` is an IANA zone string, `operations_enabled`
        is a boolean, `max_operation_amount` is a MoneyAmount string.
      oneOf:
        - type: string
        - type: boolean
    SettingItem:
      type: object
      required: [key, own, effective, sourceNodeId]
      properties:
        key: { $ref: '#/components/schemas/SettingKey' }
        own:
          nullable: true
          description: Value set on this node, or null when inherited.
          oneOf:
            - type: string
            - type: boolean
        effective: { $ref: '#/components/schemas/SettingValue' }
        sourceNodeId:
          type: string
          format: uuid
          nullable: true
          description: Node that provides the effective value; null for the built-in default.
    SettingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SettingItem' }
    PutSettingRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { $ref: '#/components/schemas/SettingValue' }
    Member:
      type: object
      required: [userId, email, role, nodeId, inheritedFrom, grantedAt]
      properties:
        userId: { type: string, format: uuid }
        email: { $ref: '#/components/schemas/Email' }
        role: { $ref: '#/components/schemas/Role' }
        nodeId: { type: string, format: uuid }
        inheritedFrom: { type: string, format: uuid, nullable: true }
        grantedAt: { type: string, format: date-time }
    MemberPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        nextCursor: { type: string, nullable: true }
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        role: { $ref: '#/components/schemas/Role' }
        initialPassword: { $ref: '#/components/schemas/Password' }
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
    Balance:
      type: object
      required: [nodeId, amount, currency, updatedAt]
      properties:
        nodeId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        updatedAt: { type: string, format: date-time }
    OperationRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        comment: { type: string, maxLength: 200 }
    TransferRequest:
      type: object
      additionalProperties: false
      required: [fromNodeId, toNodeId, amount]
      properties:
        fromNodeId: { type: string, format: uuid }
        toNodeId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        comment: { type: string, maxLength: 200 }
    Operation:
      type: object
      required: [id, nodeId, kind, amount, balanceAfter, transferId, counterpartyNodeId, comment, actorId, createdAt]
      properties:
        id: { type: string, format: uuid }
        nodeId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/OperationKind' }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        balanceAfter: { $ref: '#/components/schemas/MoneyAmount' }
        transferId: { type: string, format: uuid, nullable: true }
        counterpartyNodeId: { type: string, format: uuid, nullable: true }
        comment: { type: string, maxLength: 200, nullable: true }
        actorId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    OperationListItem:
      description: Operation with the name of its node.
      allOf:
        - $ref: '#/components/schemas/Operation'
        - type: object
          required: [nodeName]
          properties:
            nodeName: { type: string }
    OperationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OperationListItem' }
        nextCursor: { type: string, nullable: true }
    Transfer:
      type: object
      required: [transferId, out, in]
      properties:
        transferId: { type: string, format: uuid }
        out: { $ref: '#/components/schemas/Operation' }
        in: { $ref: '#/components/schemas/Operation' }
    Totals:
      type: object
      required: [count, credits, debits, net]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        credits: { $ref: '#/components/schemas/ReportSum' }
        debits: { $ref: '#/components/schemas/ReportSum' }
        net: { $ref: '#/components/schemas/ReportSum' }
    PeriodTotals:
      allOf:
        - $ref: '#/components/schemas/Totals'
        - type: object
          required: [periodStart]
          properties:
            periodStart: { type: string, format: date, description: Local start date of the period. }
    SubtreeSummary:
      type: object
      required: [scopeNodeId, tz, totals, series]
      properties:
        scopeNodeId: { type: string, format: uuid }
        tz: { type: string }
        totals: { $ref: '#/components/schemas/Totals' }
        series:
          type: array
          items: { $ref: '#/components/schemas/PeriodTotals' }
    ChildTotals:
      allOf:
        - $ref: '#/components/schemas/Totals'
        - type: object
          required: [nodeId, name, type, active, balance]
          properties:
            nodeId: { type: string, format: uuid }
            name: { type: string }
            type: { $ref: '#/components/schemas/NodeType' }
            active: { type: boolean }
            balance: { $ref: '#/components/schemas/ReportSum' }
    ChildTotalsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChildTotals' }
        nextCursor: { type: string, nullable: true }
    AuditEntry:
      type: object
      required: [id, occurredAt, actorId, actorEmail, nodeId, nodeName, action, targetType, targetId, before, after, requestId]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorId: { type: string, format: uuid }
        actorEmail:
          type: string
          nullable: true
          description: Null when the actor is not visible to the requester.
        nodeId: { type: string, format: uuid }
        nodeName: { type: string }
        action: { $ref: '#/components/schemas/AuditAction' }
        targetType: { $ref: '#/components/schemas/AuditTargetType' }
        targetId: { type: string }
        before:
          type: object
          nullable: true
          additionalProperties: { type: string }
        after:
          type: object
          nullable: true
          additionalProperties: { type: string }
        requestId: { type: string }
    AuditPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        nextCursor: { type: string, nullable: true }

