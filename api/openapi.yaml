openapi: 3.0.3
info:
  title: Tenant Backoffice API
  version: 1.0.0
  description: |
    Source of truth for the REST contract (spec 03). Money is always a string of digits in minor
    units. Errors are RFC 9457 problem details (`application/problem+json`).
    Runtime validation of patterns and enums is done by `Input.Validate()` and the domain;
    this document describes the same rules.
    `x-error-codes` lists, per response status, the error codes the operation can return.
servers:
  - url: /api/v1
tags:
  - { name: health }
  - { name: auth }
  - { name: me }
  - { name: nodes }
  - { name: settings }
  - { name: members }
  - { name: balance }
  - { name: operations }
  - { name: reports }
  - { name: audit }
security:
  - bearerAuth: []

paths:
  /healthz:
    servers:
      - url: /
    get:
      operationId: healthz
      summary: Liveness probe (the process is alive)
      tags: [health]
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /readyz:
    servers:
      - url: /
    get:
      operationId: readyz
      summary: Readiness probe (the database answers)
      tags: [health]
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: Not ready (the database does not answer)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Access token; the refresh token is set as the tb_refresh cookie
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed]
        '401': [invalid_credentials]
        '413': [payload_too_large]
        '415': [unsupported_media_type]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh cookie and issue a new access token
      tags: [auth]
      security:
        - {refreshCookie: [], csrfHeader: []}
      responses:
        '200':
          description: New access token and a new tb_refresh cookie
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '401': [refresh_invalid]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out; revokes the refresh family and clears the cookie
      tags: [auth]
      responses:
        '204':
          description: Signed out
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '401': [token_missing, token_expired, token_invalid]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
  /auth/password:
    post:
      operationId: changePassword
      summary: Change the own password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Changed; all refresh families revoked
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed, invalid_password]
        '401': [token_missing, token_expired, token_invalid, invalid_credentials]
        '413': [payload_too_large]
        '415': [unsupported_media_type]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
  /me:
    get:
      operationId: getMe
      summary: Current user and access roots
      tags: [me]
      responses:
        '200':
          description: Profile
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '401': [token_missing, token_expired, token_invalid]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
  /me/permissions:
    get:
      operationId: getMyPermissions
      summary: Role and permissions of the current user on a node
      tags: [me]
      parameters:
        - $ref: '#/components/parameters/NodeIdQuery'
      responses:
        '200':
          description: Permissions
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodePermissions' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed, invalid_id]
        '401': [token_missing, token_expired, token_invalid]
        '403': [forbidden]
        '404': [not_found]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
  /nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    get:
      operationId: getNode
      summary: Get a node
      tags: [nodes]
      responses:
        '200':
          description: Node
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed, invalid_id]
        '401': [token_missing, token_expired, token_invalid]
        '403': [forbidden]
        '404': [not_found]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
    patch:
      operationId: renameNode
      summary: Rename a node
      tags: [nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameNodeRequest' }
      responses:
        '200':
          description: Renamed node
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed, invalid_id]
        '401': [token_missing, token_expired, token_invalid]
        '403': [forbidden]
        '404': [not_found]
        '409': [name_taken]
        '413': [payload_too_large]
        '415': [unsupported_media_type]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
    delete:
      operationId: deleteNode
      summary: Delete a node
      tags: [nodes]
      responses:
        '204':
          description: Deleted
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed, invalid_id]
        '401': [token_missing, token_expired, token_invalid]
        '403': [forbidden]
        '404': [not_found]
        '409': [node_has_children, node_has_balance, node_has_history]
        '422': [root_immutable]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
  /nodes/{id}/children:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    get:
      operationId: listChildren
      summary: List direct children
      tags: [nodes]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: A page of children
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeSummaryPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed, invalid_id, invalid_cursor]
        '401': [token_missing, token_expired, token_invalid]
        '403': [forbidden]
        '404': [not_found]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
    post:
      operationId: createChild
      summary: Create a child node
      tags: [nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNodeRequest' }
      responses:
        '201':
          description: Created node
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed, invalid_id]
        '401': [token_missing, token_expired, token_invalid]
        '403': [forbidden]
        '404': [not_found]
        '409': [name_taken, node_inactive, children_limit]
        '413': [payload_too_large]
        '415': [unsupported_media_type]
        '422': [invalid_parent_type]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
  /nodes/{id}/move:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    post:
      operationId: moveNode
      summary: Move a node under another parent
      tags: [nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveNodeRequest' }
      responses:
        '200':
          description: Moved node
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed, invalid_id]
        '401': [token_missing, token_expired, token_invalid]
        '403': [forbidden]
        '404': [not_found]
        '409': [name_taken, node_inactive, children_limit]
        '413': [payload_too_large]
        '415': [unsupported_media_type]
        '422': [move_cycle, invalid_parent_type, root_immutable]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
  /nodes/{id}/move-targets:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    get:
      operationId: listMoveTargets
      summary: List valid new parents for a node
      tags: [nodes]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: A page of candidate parents
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeSummaryPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed, invalid_id, invalid_cursor]
        '401': [token_missing, token_expired, token_invalid]
        '403': [forbidden]
        '404': [not_found]
        '422': [root_immutable]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
  /nodes/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    post:
      operationId: deactivateNode
      summary: Deactivate a node
      tags: [nodes]
      responses:
        '200':
          description: Node
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed, invalid_id]
        '401': [token_missing, token_expired, token_invalid]
        '403': [forbidden]
        '404': [not_found]
        '422': [root_immutable]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
  /nodes/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    post:
      operationId: activateNode
      summary: Activate a node
      tags: [nodes]
      responses:
        '200':
          description: Node
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed, invalid_id]
        '401': [token_missing, token_expired, token_invalid]
        '403': [forbidden]
        '404': [not_found]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
  /nodes/{id}/settings:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    get:
      operationId: listSettings
      summary: Own and effective settings of a node
      tags: [settings]
      responses:
        '200':
          description: Settings
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingList' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed, invalid_id]
        '401': [token_missing, token_expired, token_invalid]
        '403': [forbidden]
        '404': [not_found]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
  /nodes/{id}/settings/{key}:
    parameters:
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/SettingKeyPath'
    put:
      operationId: putSetting
      summary: Set an own setting value
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutSettingRequest' }
      responses:
        '200':
          description: The setting after the change
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400': [validation_failed, invalid_id]
        '401': [token_missing, token_expired, token_invalid]
        '403': [forbidden]
        '404': [not_found, unknown_setting]
        '413': [payload_too_large]
        '415': [unsupported_media_type]
        '422': [invalid_setting_value]
        '429': [rate_limited]
        '500': [internal]
        '503': [db_unavailable]
    delete:
      operationId: deleteSetting
      summary: Remove an own setting value (inherit again)
      tags: [settings]
      responses:
        '200':
          description: The setting after the change
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
