name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Processes run on the runner host; the service container is reached through its published port.
      TB_TEST_DB_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Installs the linter binary only; `make lint-go` runs it.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      - name: Run CI targets on the host
        run: make ci-inner GO= NPM= PSQL="psql -h 127.0.0.1"

  # End-to-end scenarios (T-E-01..06) against the compose stack. `make e2e` builds a clean database,
  # starts api and web on it, runs the Playwright container in the compose network and removes everything
  # afterwards; it needs the postgres container to exist first, as `make db-bootstrap` runs inside it.
  e2e:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Local JWT and cursor keys
        run: make keys

      - name: Start postgres
        run: docker compose up -d --wait postgres

      - name: End-to-end tests
        run: make e2e

      # Traces are off by default (they keep request headers); the report holds screenshots and videos.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
