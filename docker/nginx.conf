# Placeholder until the web client lands: one origin, /api proxied to the API.
server {
    listen 80;

    # Docker's embedded DNS; resolved per request so nginx starts even if api restarts.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        default_type text/plain;
        return 200 "web placeholder\n";
    }
}
