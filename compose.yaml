name: tenant-backoffice

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${TB_POSTGRES_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${TB_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: ../docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: keys/cursor.env
        required: false
    environment:
      TB_HTTP_ADDR: ${TB_HTTP_ADDR:-:8080}
      TB_LOG_LEVEL: ${TB_LOG_LEVEL:-info}
      TB_LOG_FORMAT: ${TB_LOG_FORMAT:-json}
      TB_DB_URL: postgres://tb_app:${TB_APP_PASSWORD:?set in .env}@${TB_DB_HOST:-postgres}:${TB_DB_PORT:-5432}/${TB_DB_NAME:-tenant_backoffice}?sslmode=disable
      TB_DB_MIGRATE_URL: postgres://tb_owner:${TB_OWNER_PASSWORD:?set in .env}@${TB_DB_HOST:-postgres}:${TB_DB_PORT:-5432}/${TB_DB_NAME:-tenant_backoffice}?sslmode=disable
      TB_DB_CONNECT_TIMEOUT: ${TB_DB_CONNECT_TIMEOUT:-30s}
      TB_JWT_KEYS_DIR: /run/keys
      TB_JWT_ACTIVE_KID: ${TB_JWT_ACTIVE_KID:-k2026a}
      TB_ACCESS_TTL: ${TB_ACCESS_TTL:-10m}
      TB_REFRESH_TTL: ${TB_REFRESH_TTL:-168h}
      TB_CURRENCY: ${TB_CURRENCY:-EUR}
    volumes:
      - ./keys:/run/keys:ro
    ports:
      - "127.0.0.1:${TB_API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 3s
      timeout: 4s
      retries: 20

  web:
    image: nginx:1.29-alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${TB_WEB_HOST_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  go-tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/go-tools.Dockerfile
    working_dir: /workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TB_TEST_DB_ADMIN_URL: postgres://postgres:${TB_POSTGRES_PASSWORD:?set in .env}@${TB_DB_HOST:-postgres}:${TB_DB_PORT:-5432}/postgres?sslmode=disable
      TB_DB_MIGRATE_URL: postgres://tb_owner:${TB_OWNER_PASSWORD:?set in .env}@${TB_DB_HOST:-postgres}:${TB_DB_PORT:-5432}/${TB_DB_NAME:-tenant_backoffice}?sslmode=disable
    volumes:
      - .:/workspace
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build

  web-tools:
    profiles: ["tools"]
    image: node:24-bookworm-slim
    working_dir: /workspace/web
    volumes:
      - .:/workspace
      - npmcache:/root/.npm

  playwright:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /workspace/web
    environment:
      E2E_BASE_URL: ${E2E_BASE_URL:-http://web}
    volumes:
      - .:/workspace

volumes:
  pgdata:
  gomod:
  gobuild:
  npmcache:
